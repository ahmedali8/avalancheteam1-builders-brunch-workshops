[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
# Solidity deps are bun-managed in node_modules (see remappings.txt), not `forge install`.
libs = ["node_modules"]
solc = "0.8.36"
# Target Prague. This contract emits no Prague-specific features (no EIP-7702, no new
# precompiles), so the compiled bytecode stays within the opcode set Fuji already accepts.
evm_version = "prague"
optimizer = true
optimizer_runs = 200

[fmt]
line_length = 120

# Named RPC aliases, so `--rpc-url fuji` works without shell variable expansion.
[rpc_endpoints]
fuji = "${FUJI_RPC_URL}"

# Contract verification needs no config here: `just verify-fuji` passes the Routescan
# verifier URL on the command line and needs no API key.

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
